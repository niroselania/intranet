<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intranet Patagonia</title>
<style>
  :root { --overlay: .35; --font: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: #fff;
    background: #1d2b36 center / cover no-repeat fixed;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: rgba(0,0,0,var(--overlay)); z-index: 0;
  }
  header, main, footer { position: relative; z-index: 1; }
  header { text-align: center; padding: 48px 16px 8px; }
  header img { max-height: 56px; }
  header h1 {
    font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: .18em; text-transform: uppercase;
  }
  header p {
    margin-top: 8px; font-size: .85rem; letter-spacing: .3em;
    text-transform: uppercase; opacity: .85;
  }
  main {
    flex: 1; width: 100%; max-width: 980px; margin: 0 auto;
    padding: 32px 20px 48px;
    display: flex; flex-direction: column; justify-content: center; gap: 36px;
  }
  .group h2 {
    font-size: .8rem; font-weight: 700; letter-spacing: .25em;
    text-transform: uppercase; text-align: center; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.35);
  }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .links a {
    min-width: 170px; padding: 14px 24px; text-align: center;
    color: #fff; text-decoration: none; font-weight: 700; font-size: .9rem;
    letter-spacing: .12em; text-transform: uppercase;
    border: 1.5px solid #fff; background: rgba(0,0,0,.25);
    transition: background .15s, color .15s;
  }
  .links a:hover, .links a:focus-visible { background: #fff; color: #111; outline: none; }
  .msg { text-align: center; opacity: .9; font-size: .95rem; line-height: 1.6; }
  footer { text-align: center; padding: 16px; font-size: .7rem; letter-spacing: .15em; opacity: .6; text-transform: uppercase; }
</style>
</head>
<body>
<header id="head"><h1 id="title">Patagonia</h1><p id="subtitle"></p></header>
<main id="main"><p class="msg">Cargando…</p></main>
<footer>Uso interno</footer>

<script src="vendor/js-yaml.min.js"></script>
<script>
async function loadYaml(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' (' + r.status + ')');
  return jsyaml.load(await r.text());
}

function applySettings(s) {
  s = s || {};
  const root = document.documentElement;
  if (s.font) root.style.setProperty('--font', s.font);
  if (s.overlay !== undefined) root.style.setProperty('--overlay', s.overlay);
  if (s.background) document.body.style.backgroundImage = 'url("' + s.background + '")';
  document.title = (s.subtitle ? s.subtitle + ' - ' : '') + (s.title || 'Patagonia');
  document.getElementById('subtitle').textContent = s.subtitle || '';
  const h1 = document.getElementById('title');
  if (s.logo) {
    const img = document.createElement('img');
    img.src = s.logo; img.alt = s.title || 'Logo';
    h1.replaceWith(img);
  } else {
    h1.textContent = s.title || 'Patagonia';
  }
}

function render(groups) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (!Array.isArray(groups) || !groups.length) {
    main.innerHTML = '<p class="msg">No hay sitios cargados en services.yaml</p>';
    return;
  }
  groups.forEach(g => {
    Object.entries(g || {}).forEach(([groupName, items]) => {
      const sec = document.createElement('section');
      sec.className = 'group';
      const h2 = document.createElement('h2');
      h2.textContent = groupName;
      const box = document.createElement('div');
      box.className = 'links';
      (items || []).forEach(it => {
        Object.entries(it || {}).forEach(([name, cfg]) => {
          if (!cfg || !cfg.href) return;
          const a = document.createElement('a');
          a.href = cfg.href;
          a.textContent = name;
          if (cfg.target) a.target = cfg.target;
          if (cfg.target === '_blank') a.rel = 'noopener';
          box.appendChild(a);
        });
      });
      sec.append(h2, box);
      main.appendChild(sec);
    });
  });
}

(async () => {
  try { applySettings(await loadYaml('config/settings.yaml')); } catch (e) { applySettings({}); console.warn(e); }
  try { render(await loadYaml('config/services.yaml')); }
  catch (e) {
    document.getElementById('main').innerHTML =
      '<p class="msg">No se pudo leer config/services.yaml<br>' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
